name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "converters.js"
      - "translator.js"
      - "vendor/**"
      - "styles.css"
      - "package.json"
      - "capacitor.config.json"
      - "native/**"
      - "scripts/**"
      - ".github/workflows/build-apps.yml"

permissions:
  contents: write

concurrency:
  group: build-apps
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Giữ cùng một khóa ký debug giữa các lần build để cài đè bản mới không phải gỡ app.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - run: npm install --install-links
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk SachCuaBan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SachCuaBan.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --install-links
      - run: npm run build
      - run: npx cap add ios --packagemanager SPM
      - run: npx cap sync ios
      - name: Enable background audio
        run: |
          plist=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$plist" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" -c "Add :UIBackgroundModes:0 string audio" "$plist"
      - name: Build unsigned IPA
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry SachCuaBan.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: SachCuaBan.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish to the "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete app-latest --repo "$REPO" --cleanup-tag --yes || true
          gh release create app-latest SachCuaBan.apk SachCuaBan.ipa --repo "$REPO" --target "$GITHUB_SHA" \
            --prerelease --title "Bản app mới nhất" \
            --notes "Tự build từ commit ${GITHUB_SHA::7}. iPhone: cài SachCuaBan.ipa bằng AltStore/Sideloadly. Android: tải SachCuaBan.apk và mở để cài."
